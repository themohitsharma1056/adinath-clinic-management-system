<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Login | Adinath Clinic</title>

<link rel="stylesheet"
      th:href="@{/css/admin/login.css}">
<link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="login-header">

            <img
                th:src="@{/images/doctor-icon.svg}"
                alt="Adinath Clinic"
                class="login-logo">

            <h1>Adinath Clinic</h1>
          <p>Dental • Eye Care • Optometry</p>


            <h2>

                Admin Portal

            </h2>
<div th:if="${param.error}" class="login-error">
    Invalid username or password.
</div>

<div th:if="${param.logout}" class="login-success">
    Logged out successfully.
</div>
        </div>

        <form
            th:action="@{/admin/login}"
            method="post"
            class="login-form">

            <div class="input-group">

                <label>

                    Username

                </label>

                <input

                        type="text"

                        name="username"

                        required>

            </div>

            <div class="input-group">

                <label>

                    Password

                </label>

                <input

                        type="password"

                        name="password"

                        required>

            </div>

            <button
                    type="submit"
                    class="login-btn">

                Login

            </button>

        </form>

        <div class="login-footer">

            © 2026 Adinath Clinic

        </div>

    </div>

</div>

</body>

</html>
